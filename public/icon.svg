<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050f0a"/>
      <stop offset="100%" stop-color="#0a1f14"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Central glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowCenter)"/>

  <!-- Soccer ball - geometric modern style -->
  <g filter="url(#glow)">
    <!-- Ball base circle -->
    <circle cx="256" cy="256" r="90" fill="url(#ballGrad)" opacity="0.95"/>

    <!-- Hexagonal pattern - simplified modern look -->
    <!-- Center hexagon -->
    <polygon points="256,210 282,228 282,262 256,280 230,262 230,228" fill="none" stroke="#0a1f14" stroke-width="2.5" opacity="0.5"/>

    <!-- Top hexagons -->
    <polygon points="256,196 272,208 272,226 256,238 240,226 240,208" fill="none" stroke="#0a1f14" stroke-width="2" opacity="0.4"/>

    <!-- Left hexagon -->
    <polygon points="218,244 234,236 248,248 244,268 226,272 214,260" fill="none" stroke="#0a1f14" stroke-width="2" opacity="0.4"/>

    <!-- Right hexagon -->
    <polygon points="294,244 278,236 264,248 268,268 286,272 298,260" fill="none" stroke="#0a1f14" stroke-width="2" opacity="0.4"/>

    <!-- Bottom-left hexagon -->
    <polygon points="228,278 244,270 256,284 250,302 234,304 222,292" fill="none" stroke="#0a1f14" stroke-width="2" opacity="0.4"/>

    <!-- Bottom-right hexagon -->
    <polygon points="284,278 268,270 256,284 262,302 278,304 290,292" fill="none" stroke="#0a1f14" stroke-width="2" opacity="0.4"/>

    <!-- Highlight -->
    <ellipse cx="238" cy="232" rx="35" ry="22" fill="white" opacity="0.12" transform="rotate(-25,238,232)"/>
  </g>

  <!-- Broadcast signal waves (top-right) -->
  <g transform="translate(355, 145)" filter="url(#softGlow)">
    <path d="M 0,0 Q 14,-16 0,-34" fill="none" stroke="url(#orangeGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -10,6 Q 16,-20 -4,-44" fill="none" stroke="url(#orangeGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M -18,12 Q 20,-26 -10,-54" fill="none" stroke="url(#orangeGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Live indicator dot -->
  <circle cx="355" cy="145" r="6" fill="url(#orangeGrad)" filter="url(#softGlow)">
    <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle motion lines -->
  <g opacity="0.2">
    <line x1="135" y1="256" x2="165" y2="256" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <line x1="122" y1="238" x2="150" y2="238" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="128" y1="274" x2="155" y2="274" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
